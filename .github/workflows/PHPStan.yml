name: Analyze PHP code with PHPStan
on:
  - push
  - pull_request
jobs:
  phpstan:
    name: Run PHPStan at maximum level
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php-version:
          - "8.2"
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Set up PHP environment
        uses: pmmp/setup-php-action@e031917a35223b96cba12fe19ace0765c91f6bfb
        with:
          php-version: ${{matrix.php-version}}
          install-path: "./dev/bin"
      - name: Run PHPStan at maximum level
        run: make phpstan PHP="php -dphar.readonly=0 -dmemory_limit=256M"
